name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: personal-training-site/package-lock.json
      - name: Install dependencies
        working-directory: personal-training-site
        run: npm ci
      - name: Typecheck
        working-directory: personal-training-site
        run: npx tsc -b
      - name: Lint
        working-directory: personal-training-site
        run: npm run lint
      - name: Test
        working-directory: personal-training-site
        run: npm run test
      - name: Build
        working-directory: personal-training-site
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal-training-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
