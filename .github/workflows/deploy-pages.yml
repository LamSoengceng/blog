name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每日刷新观赛赛程（北京时间 08:00）。
    - cron: '0 0 * * *'
    # 兜底部署：sync-stock 用 GITHUB_TOKEN 推送不会触发本 workflow，
    # 定时在数据更新后（北京 18:00 = UTC 10:00，周一至周五）重新构建发布一次。
    - cron: '0 10 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 下 jsdom/undici 报 webidl.util.markAsUncloneable 缺失，测试必挂；
          # 统一到 22（与 sync-stock 一致），本地验证 92 测试全过。
          node-version: 22
          cache: npm
          cache-dependency-path: personal-training-site/package-lock.json
      - name: Install dependencies
        working-directory: personal-training-site
        run: npm ci
      - name: Refresh sports schedule
        working-directory: personal-training-site
        run: node scripts/generateSportsSchedule.mjs
      - name: Typecheck
        working-directory: personal-training-site
        run: npx tsc -b
      - name: Lint
        working-directory: personal-training-site
        run: npm run lint
      - name: Test
        working-directory: personal-training-site
        run: npm run test
      - name: Verify Hot100 contracts and Python runtime
        working-directory: personal-training-site
        run: npm run test:practice
      - name: Build
        working-directory: personal-training-site
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal-training-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
